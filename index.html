<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SE Connect · Member Login</title><link rel="stylesheet" href="assets/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="assets/core.js"></script></head><body><div class="login-wrap"><div class="card login-card"><div class="brand"><span class="logo">SE</span><span data-brand></span></div><div class="eyebrow" style="margin-top:30px">Private member network</div><h1>Welcome back.</h1><p class="muted">Sign in to discover members, update your profile and start private conversations.</p><form id="loginForm"><label>Username</label><input id="username" class="input" placeholder="firstname.lastname" required style="margin:7px 0 14px"><label>Password</label><input id="password" type="password" class="input" placeholder="••••••••" required style="margin:7px 0 18px"><button class="btn primary" style="width:100%">Sign in</button><p id="error" style="color:#b33f3b"></p></form><p class="muted" style="font-size:13px">Forgot your password? Contact the community administrator for a reset.</p></div></div><script>
const {C,$,slugify,getSupabase}=Common;
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  $('#error').textContent='';
  const u=slugify($('#username').value.trim());
  try{
    const s=await getSupabase();
    const email=`${u}@${C.MEMBER_EMAIL_DOMAIN}`;
    const {data,error}=await s.auth.signInWithPassword({email,password:$('#password').value});
    if(error)throw error;
    const {data:p,error:pe}=await s.from('profiles').select('role,status').eq('id',data.user.id).single();
    if(pe)throw pe;
    if(p.status==='blocked'){
      await s.auth.signOut();
      throw new Error('Your account is blocked. Contact an administrator.');
    }
    location.href=p.role==='admin'?'admin.html':'members.html';
  }catch(err){
    $('#error').textContent=err.message||'Login failed';
  }
});
</script></body></html>
