<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SE Connect · Profile</title><link rel="stylesheet" href="assets/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="assets/demo-data.js"></script><script src="assets/core.js"></script></head><body><div class="shell"><header class="topbar"><div class="brand"><span class="logo">SE</span><span data-brand></span></div><nav class="nav"><a href="members.html">Members</a><a href="profile.html">My profile</a><a href="messages.html">Messages</a><a href="#" onclick="Common.signOut()">Sign out</a></nav></header><div id="profile" class="page-grid"></div></div><div id="editModal" class="modal"><div class="card modal-card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Edit profile</h2><button class="btn" type="button" onclick="editModal.classList.remove('open')">Close</button></div><form id="editForm" class="form-grid"><div><label>Short headline</label><input id="fHeadline" class="input"></div><div><label>Location</label><input id="fLocation" class="input"></div><div><label>Company / organisation</label><input id="fCompany" class="input"></div><div><label>LinkedIn</label><input id="fLinkedin" class="input"></div><div class="full"><label>Who I am</label><textarea id="fBio" rows="4"></textarea></div><div class="full"><label>What I’m obsessed with / building</label><textarea id="fBuilding" rows="3"></textarea></div><div class="full"><label>Topics / skills (comma separated)</label><input id="fSkills" class="input"></div><div class="full"><label>One thing I can help with</label><textarea id="fHelp" rows="2"></textarea></div><div class="full"><label>One thing I am looking for</label><textarea id="fLooking" rows="2"></textarea></div><div class="full"><button class="btn primary">Save profile</button></div></form></div></div><div id="passwordModal" class="modal"><div class="card modal-card" style="max-width:480px"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Change password</h2><button class="btn" type="button" onclick="passwordModal.classList.remove('open')">Close</button></div><form id="passwordForm"><label>New password</label><input id="newPassword" type="password" minlength="10" class="input" placeholder="At least 10 characters" required style="margin:8px 0 12px"><label>Confirm new password</label><input id="confirmPassword" type="password" minlength="10" class="input" required style="margin:8px 0 16px"><button class="btn primary" style="width:100%">Update password</button><p id="passwordMessage" class="muted" style="font-size:13px"></p></form></div></div><script src="assets/profile.js"></script></body></html>
